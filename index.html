    /**
     * Simula la autenticación JWT y el RLS usando RUT/Email y Clave Única.
     * El Rol se determina basado en la combinación.
     */
    function handleLogin() {
        // Se usa el mismo campo 'rut' para capturar RUT o Email.
        const identifier = document.getElementById('rut').value.trim().toLowerCase();
        const password = document.getElementById('password').value.trim(); // Simula la Clave Única
        let role = null;

        // **RLS SIMULADO CON EL NUEVO MODELO:**
        // 1. Agricultor usa RUT
        if (identifier === '12345678-9' && password === '123') {
            role = 'agricultor';
        } 
        // 2. Asesor usa rut para asesor técnico/corporativo)
        else if (identifier === '98765432-1' && password === '456') {
            role = 'asesor';
        }
        if (role) {
            // Simulación RLS: Guardar el rol autenticado
            sessionStorage.setItem('agroges_role', role);         
            // Ocultar Login y mostrar App
            LOGIN_VIEW.style.display = 'none';
            APP_VIEW.style.display = 'block';
            // Cargar la interfaz según el rol
            loadInterface(role);
            // **********************************************
            // >> INSERTA ESTO AQUÍ <<
            // **********************************************

            const toast = document.getElementById('pwa-status-toast');
            const toastContent = role === 'agricultor' ? 'Acceso Exitoso: Panel Agricultor' : 'Acceso Exitoso: Asesor (Panel de Control)';
            
            // Mostrar mensaje flotante de éxito

            toast.classList.add('show');
            
            // Ocultar el mensaje después de 3 segundos
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);

            // **********************************************
            // >> FIN DE LA INSERCIÓN <<
            // **********************************************
        } else {
            alert('Credenciales no válidas. Por favor, verifique su RUT/Email y Clave Única.');
        }
    }

            { id: 'dashboard', name: 'Panel Principal', icon: 'dashboard', default: true },

            { id: 'alertas', name: 'Alertas', icon: 'notifications' },
            { id: 'usuarios', name: 'Gestión', icon: 'people' },
        ];
    }

    // Renderizar menú (manteniendo tu lógica original)
    menuItems.forEach(item => {
        const li = document.createElement('div');
        li.className = 'it' + (item.default ? ' a' : '');
        li.dataset.page = item.id;
        li.innerHTML = `<span class="material-icons">${item.icon}</span>${item.name}`; 
        li.onclick = () => changePage(item.id);
        SIDEBAR_MENU.appendChild(li);
    });

    // Cargar página por defecto
    changePage(menuItems[0].id);
}
    /**
     * Simula la navegación entre vistas.
     */
    function changePage(pageId) {
        // Remover clase 'a' de todos los items
        document.querySelectorAll('.sb .it').forEach(item => item.classList.remove('a'));
        // Añadir clase 'a' al item seleccionado
        const selectedItem = document.querySelector(`.sb .it[data-page="${pageId}"]`);
        if (selectedItem) {
            selectedItem.classList.add('a');
        }

        MAIN_CONTENT.innerHTML = getPageContent(pageId, sessionStorage.getItem('agroges_role'));
        
        // Cargar estado de sincronización al cargar el Dashboard del Agricultor
        if (pageId === 'dashboard' && sessionStorage.getItem('agroges_role') === 'agricultor') {
            updateSyncStatus();
            loadLocalHistory(); // Carga la historia local si está en el dashboard
        }
        
        // Cargar el historial local al entrar a Anotaciones
        if (pageId === 'anotaciones' && sessionStorage.getItem('agroges_role') === 'agricultor') {
            loadLocalHistory();
        }
    }

    /**

     */
    function showGranjaDetail(granjaId) {
        const granja = GRANJAS_DATA.find(g => g.id === granjaId);
        if (!granja) return;

        // **PASO 4 SIMULADO (ACTUALIZADO CON DATA SINCRONIZADA)**
        let actividadesHTML = `
            <div class="g-it" style="background:#f5f5f5; border-left: 3px solid #2E7D32;">
                <span class="material-icons">task_alt</span>

        // Agregar la actividad que el agricultor registró offline (si existe)
        const offlineData = getLocalData();
        // Nota: Solo se muestra el registro offline para la granja del agricultor de prueba 'g1'
        const syncedActivity = offlineData.find(d => d.granjaId === 'g1' && d.sincronizado); 
        
        if (syncedActivity && granjaId === 'g1') {
            actividadesHTML = `
                <div class="g-it" style="background:#E0F7FA; border-left: 3px solid #00BCD4; margin-bottom: 10px;">
                    <span class="material-icons">sync</span>

                </div>
                ${actividadesHTML}
            `;
            // Limpiar la marca de sincronizado para la próxima simulación
            offlineData.forEach(d => { if(d.granjaId === 'g1') d.sincronizado = false; });

                <div class="cd" style="background: #1B5E20;"><h3>Agricultor</h3><p>${granja.agricultor}</p></div>
                <div class="cd" style="background: #757575;"><h3>Ubicación</h3><p>${granja.sector}</p></div>
            </div>
            
            <h3>Actividades Recientes (Monitoreo Asíncrono)</h3>

            <button class="bt" style="margin-top: 20px;">✉️ Contactar a ${granja.agricultor}</button>
        `;

        // Quitar la selección del menú lateral
        document.querySelectorAll('.sb .it').forEach(item => item.classList.remove('a'));
    }

    // --- OBJETIVO 2 & 3: LÓGICA OFFLINE-FIRST (PWA LITE) Y SINCRONIZACIÓN ---
    
    /**
     * Recupera las tareas pendientes de sincronizar de localStorage.
     */
    function getLocalData() {
        const data = localStorage.getItem(STORAGE_KEY);
        return data ? JSON.parse(data) : [];
    }

    /**
     * Guarda el array de tareas pendientes en localStorage.
     */
    function saveLocalData(data) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
        updateSyncStatus();
        loadLocalHistory();
    }

    /**
     * Actualiza el contador de tareas pendientes en el Dashboard.
     */
    function updateSyncStatus() {
        const pendingCount = getLocalData().filter(d => !d.sincronizado).length;
        const statusCard = document.getElementById('sync-status-card');
        const statusText = document.getElementById('sync-status-text');

        if (statusCard && statusText) {
            if (pendingCount > 0) {
                statusText.innerHTML = `⚠️ Tienes <strong>${pendingCount}</strong> tareas registradas sin conexión, pendientes de sincronización.`;
                statusCard.classList.add('warning');
                statusCard.classList.remove('success');
                statusCard.style.display = 'block';
            } else {
                statusText.innerHTML = '✅ Todos tus datos están sincronizados. ¡Buen trabajo!';
                statusCard.classList.add('success');
                statusCard.classList.remove('warning');
                statusCard.style.display = 'block';
            }
        }
    }

    /**
     * Carga y muestra el historial de registros offline.
     */
    function loadLocalHistory() {
        const historyContainer = document.getElementById('local-history');
        if (!historyContainer) return;
        
        const pendingTasks = getLocalData().filter(d => !d.sincronizado);
        
        if (pendingTasks.length === 0) {
            historyContainer.innerHTML = '<p style="color: #999;">No hay registros pendientes de sincronización.</p>';
            return;
        }

        historyContainer.innerHTML = pendingTasks.map((d, index) => `
            <div class="md p" style="border-left-color: #FF9800;">
                <span class="material-icons">save</span>
                <div class="md-txt">
                    <h4>Registro #${index + 1}: ${d.modulo}</h4>
                    <p>${d.descripcion.substring(0, 50)}...</p>
                </div>
                <h4 style="color: #999;">Guardado local: ${new Date(d.fecha).toLocaleTimeString()}</h4>
            </div>
        `).join('');
    }

    /**
     * PASO 2: Guarda el avance del formulario en localStorage (Simulación Latencia Cero).
     */
    function registerOffline() {
        const modulo = document.getElementById('mod-select').value;
        const descripcion = document.getElementById('avance-desc').value.trim();
        const successMsg = document.getElementById('offline-success-msg');

        if (descripcion.length < 5) {
            successMsg.textContent = 'X.. Por favor, ingrese una descripción de avance válida.';
            successMsg.className = 'al error';
            successMsg.style.display = 'block';
            return;
        }

        const newEntry = {
            id: Date.now(),
            granjaId: 'g1', // RLS: Siempre la granja del agricultor de prueba
            modulo: modulo,
            descripcion: descripcion,
            fecha: new Date().toISOString(),
            sincronizado: false // CRÍTICO: Bandera de Offline-First
        };

        const currentData = getLocalData();
        currentData.push(newEntry);
        saveLocalData(currentData);
// **********************************************
// >> INSERTA EL CÓDIGO AQUÍ DEBAJO <<
// **********************************************

       // [Línea A] Mensaje de éxito del guardado local
        successMsg.innerHTML = `**¡Registro Guardado Localmente!** La tarea de **${modulo}** se guardó en tu dispositivo. Esperando conexión para sincronizar.`;
        successMsg.className = 'al success';
        successMsg.style.display = 'block';

        // [Línea B] Limpiar el formulario para el siguiente registro
        document.getElementById('avance-desc').value = '';
        // Ocultar el mensaje después de 4 segundos
        setTimeout(() => {
        successMsg.style.display = 'none';
        }, 4000);
// **********************************************
// >> FIN DE LA INSERCIÓN <<
// **********************************************    

        // Limpiar formulario y mostrar éxito instantáneo
        document.getElementById('avance-desc').value = '';
        document.getElementById('photo-upload').value = '';
        successMsg.textContent = `¡LATENCIA CERO! Tarea registrada localmente (${modulo}), pendiente de sincronización.`;
        successMsg.className = 'al success';
        successMsg.style.display = 'block';
    }

    /**
     * PASO 3: Simula el Service Worker enviando la data a PostgREST.
     */
    function simulateSync() {
        const pendingTasks = getLocalData().filter(d => !d.sincronizado);
        const statusText = document.getElementById('sync-status-text');
        
        if (pendingTasks.length === 0) {
            statusText.textContent = 'No hay datos pendientes para sincronizar.';
            return;
        }

        statusText.innerHTML = '⚙️ Sincronizando datos... Por favor espere. (Simulando Service Worker)';
        
        // Simulación de latencia de red (2 segundos)
        setTimeout(() => {
            const currentData = getLocalData();
            
            // Simulación de PostgREST y Limpieza de Data Local
            // Marcar todas como sincronizadas
            currentData.forEach(d => {
                if (!d.sincronizado) {
                    d.sincronizado = true; 
                }
            });
            // NOTA CRÍTICA: En un PWA real, solo se eliminaría el dato local después de la confirmación del servidor.
            // Para la demo, simulamos la subida y mantenemos la bandera 'sincronizado' en local.
            saveLocalData(currentData);
            localStorage.removeItem(STORAGE_KEY); // Limpieza de Data Local CRÍTICA

            // Mostrar confirmación
            statusText.innerHTML = `Sincronización Completa. <strong>${pendingTasks.length}</strong> dato(s) subido(s) a la Granja Esperanza Rural (Backend Simulado).`;
            statusText.parentNode.classList.remove('warning');
            statusText.parentNode.classList.add('success');
            
            // Recargar el dashboard para reflejar el estado 'sincronizado'
            changePage('dashboard');

        }, 2000); // 2 segundos de simulación de latencia de red
    }


    // --- LÓGICA DE INICIO Y CIERRE DE SESIÓN ---

    /**
     * Cierra la sesión y vuelve a la vista de login.
     */
    function logout() {
        sessionStorage.removeItem('agroges_role');
        APP_VIEW.style.display = 'none';
        LOGIN_VIEW.style.display = 'flex';
        // Limpiar campos de login para próxima sesión
        document.getElementById('rut').value = '';
        document.getElementById('password').value = '';
    }

    /**
     * Función de inicialización al cargar la página.
     */
    function init() {
        const role = sessionStorage.getItem('agroges_role');
        
        if (role) {
            // Si hay rol guardado, va directo a la app (simula sesión activa)
            LOGIN_VIEW.style.display = 'none';
            APP_VIEW.style.display = 'block';
            loadInterface(role);
        } else {
            // Si no hay rol, muestra el login
            LOGIN_VIEW.style.display = 'flex';
            APP_VIEW.style.display = 'none';
        }

        // Asignar listener al botón de login
        document.getElementById('login-btn').onclick = handleLogin;
    }

    // Ejecutar al cargar el DOM
    document.addEventListener('DOMContentLoaded', init);

</script>
